<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
  <title>no-js-framework</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-client-side-templates@2.0.1/client-side-templates.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
</head>
<body hx-ext="client-side-templates">
  <h1>Декларативность</h1>
  <button
    hx-get="https://dummyjson.com/users?limit=10&amp;select=firstName,lastName,maidenName,email,password"
    hx-target="#users"
    hx-swap="innerHTML"
    mustache-template="users-tpl"
  >
    Загрузить пользователей
  </button>
  <ul id="users">
    <li>...</li>
  </ul>
  <template id="users-tpl">
    {{#users}}
    <li>{{lastName}} {{firstName}} {{maidenName}}, email: {{email}}, password: {{password}}</li>
    {{/users}}
  </template>
</body>
</html>
